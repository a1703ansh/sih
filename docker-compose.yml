services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skilltrace
      POSTGRES_PASSWORD: skilltrace_dev_secret
      POSTGRES_DB: skilltrace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilltrace -d skilltrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NOTE(prod): postgres is NOT published to the host by default — the backend,
  # worker, beat and flower services all reach it over the compose network
  # (POSTGRES_HOST=postgres). Re-add `ports: - "5433:5432"` here only if you need
  # to run host-side DB tools (the Makefile db-shell uses `compose exec`, so it
  # does not need it). docker-compose.prod.yml keeps this hardening in place.
  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback-only: dev reaches http://localhost:8000 unchanged; the API is
      # never exposed directly to the host network.
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Celery Worker ---
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PYTHONPATH: /
    working_dir: /
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./workers:/workers
    command: >
      celery -A workers.celery_app:app worker
      --loglevel=info
      --concurrency=4
      -Q default,surveys,scraper,nlp,notifications

  # --- Celery Beat (Scheduler) ---
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PYTHONPATH: /
    working_dir: /
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./workers:/workers
    command: >
      celery -A workers.celery_app:app beat
      --loglevel=info

  # --- Flower (Worker Monitor) ---
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PYTHONPATH: /
    working_dir: /
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./workers:/workers
    command: python -m flower flower --port=5555

  # --- Frontend (Next.js dev server, hot reload) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src

  # --- Frontend production build (opt-in): docker compose --profile prod up -d ---
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        # In-container backend origin for the Next.js /api rewrite. Hardcoded on
        # purpose: it is baked into .next/routes-manifest.json at build time, and a
        # host-facing value from .env would break the standalone server.
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      BACKEND_INTERNAL_URL: http://backend:8000
      NODE_ENV: production

volumes:
  postgres_data:
  redis_data:
