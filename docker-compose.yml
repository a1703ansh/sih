services:
  # â”€â”€â”€ PostgreSQL â”€â”€â”€
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skilltrace
      POSTGRES_PASSWORD: skilltrace_dev_secret
      POSTGRES_DB: skilltrace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilltrace -d skilltrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # â”€â”€â”€ Redis â”€â”€â”€
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # â”€â”€â”€ Elasticsearch â”€â”€â”€
  elasticsearch:
    image: elasticsearch:8.14.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # â”€â”€â”€ Backend (FastAPI) â”€â”€â”€
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # â”€â”€â”€ Celery Worker â”€â”€â”€
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PYTHONPATH: /
    working_dir: /
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./workers:/workers
    command: >
      celery -A workers.celery_app:app worker
      --loglevel=info
      --concurrency=4
      -Q default,surveys,scraper,nlp,notifications

  # â”€â”€â”€ Celery Beat (Scheduler) â”€â”€â”€
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PYTHONPATH: /
    working_dir: /
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./workers:/workers
    command: >
      celery -A workers.celery_app:app beat
      --loglevel=info

  # â”€â”€â”€ Flower (Worker Monitor) â”€â”€â”€
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PYTHONPATH: /
    working_dir: /
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./workers:/workers
    command: >
      sh -c "pip install -q flower==2.0.1 &&
      python -m flower flower --port=5555"

  # â”€â”€â”€ Frontend (Next.js) â”€â”€â”€
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  redis_data:
  es_data:
